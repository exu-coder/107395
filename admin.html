<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXUCODER PROXY · Admin</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
            overflow-x: hidden;
            position: relative;
            background: #0a0e1a;
        }

        .bg-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            inset: 0;
            background-image: url('https://i.ibb.co.com/k2ZL25g3/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.85;
            animation: slowZoom 25s ease-in-out infinite alternate;
            transform-origin: center;
        }

        @keyframes slowZoom {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(0.5deg); }
            100% { transform: scale(1.12) rotate(-0.5deg); }
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 30% 40%, rgba(123, 47, 252, 0.12) 0%, transparent 55%),
                radial-gradient(circle at 70% 60%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.15) 0%, transparent 70%);
            animation: pulseOverlay 10s ease-in-out infinite alternate;
            mix-blend-mode: overlay;
        }

        @keyframes pulseOverlay {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            animation: gridMove 30s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            animation: floatBlob 25s ease-in-out infinite;
            mix-blend-mode: screen;
        }

        .blob.a { width: 500px; height: 500px; background: #7b2ffc; top: -150px; left: -150px; animation-delay: 0s; }
        .blob.b { width: 450px; height: 450px; background: #00d4ff; bottom: -150px; right: -150px; animation-delay: -8s; opacity: 0.2; }
        .blob.c { width: 350px; height: 350px; background: #ec4899; top: 45%; left: 55%; animation-delay: -16s; opacity: 0.15; }
        .blob.d { width: 300px; height: 300px; background: #f59e0b; top: 10%; left: 30%; animation-delay: -5s; opacity: 0.12; }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(80px, -60px) scale(1.1) rotate(5deg); }
            50% { transform: translate(-40px, 80px) scale(0.95) rotate(-3deg); }
            75% { transform: translate(60px, 40px) scale(1.05) rotate(4deg); }
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 14px 32px;
            background: rgba(10, 14, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .navbar-brand img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px 8px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .navbar-user .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7b2ffc, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .navbar-user .username {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
        }

        .btn-logout {
            padding: 8px 18px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 30px;
            color: #f87171;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .glass:hover {
            border-color: rgba(255,255,255,0.12);
        }

        .main-container {
            position: relative;
            z-index: 1;
            padding: 90px 32px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            padding: 18px 22px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.1);
        }

        .stat-card .label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 800;
            margin-top: 4px;
            background: linear-gradient(135deg, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .admin-grid { grid-template-columns: 1fr; }
        }

        .card {
            padding: 24px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: rgba(255,255,255,0.8);
        }

        .card-header .badge {
            padding: 4px 12px;
            background: rgba(167, 139, 250, 0.15);
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            color: #a78bfa;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .user-list::-webkit-scrollbar {
            width: 4px;
        }

        .user-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
        }

        .user-list::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.3);
            border-radius: 10px;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            transition: all 0.3s ease;
        }

        .user-item:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.1);
        }

        .user-item .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-item .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7b2ffc, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
        }

        .user-item .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .user-item .user-email {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }

        .user-item .user-status {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .user-status.active {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }

        .user-status.inactive {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .user-item .user-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-toggle {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .btn-toggle:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .btn-toggle.active {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.15);
        }

        .log-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-list::-webkit-scrollbar {
            width: 4px;
        }

        .log-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.3);
            border-radius: 10px;
        }

        .log-item {
            padding: 8px 14px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .log-item .log-time {
            color: rgba(255,255,255,0.2);
            font-size: 11px;
        }

        .log-item .log-action {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }

        .log-action.captured {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
        }

        .log-action.swiped {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }

        .log-action.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7b2ffc, #00d4ff);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(123, 47, 252, 0.3);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.2);
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: rgba(52, 211, 153, 0.3);
            background: rgba(52, 211, 153, 0.1);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.1);
        }

        @media (max-width: 768px) {
            .navbar { padding: 12px 16px; }
            .navbar-brand { font-size: 16px; }
            .navbar-brand img { width: 28px; height: 28px; }
            .navbar-user .username { display: none; }
            .main-container { padding: 80px 16px 24px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat-card { padding: 14px 16px; }
            .stat-card .value { font-size: 20px; }
            .card { padding: 16px; }
            .user-item { flex-wrap: wrap; gap: 8px; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat-card { padding: 12px 14px; }
            .stat-card .value { font-size: 18px; }
            .blob.a, .blob.b, .blob.c, .blob.d { filter: blur(60px); opacity: 0.15; }
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="bg-image" id="bgImage"></div>
        <div class="bg-overlay"></div>
        <div class="bg-grid"></div>
        <div class="blob a"></div>
        <div class="blob b"></div>
        <div class="blob c"></div>
        <div class="blob d"></div>
    </div>

    <div id="toast" class="toast"></div>

    <nav class="navbar">
        <a href="/dashboard" class="navbar-brand">
            <img src="https://i.ibb.co.com/gBfhXFN/mrhimcho-fyp-pfp-virelvideo-unfrezzmyaccount-JPEG-1.jpg" alt="Logo" />
            𝐄𝐗𝐔𝐂𝐎𝐃𝐄𝐑
        </a>
        <div class="navbar-actions">
            <div class="navbar-user">
                <div class="avatar" id="userAvatar">A</div>
                <span class="username" id="userName">Admin</span>
            </div>
            <button class="btn-logout" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="main-container">

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label"><i class="fas fa-users"></i> Users</div>
                <div class="value" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-database"></i> JWTs</div>
                <div class="value" id="totalJWTs">0</div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-exchange-alt"></i> Swipes</div>
                <div class="value" id="totalSwipes">0</div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-users"></i> Active</div>
                <div class="value" id="activeUsers">0</div>
            </div>
        </div>

        <div class="admin-grid">

            <div class="glass card">
                <div class="card-header">
                    <h3><i class="fas fa-users" style="color: #a78bfa;"></i> Users</h3>
                    <span class="badge" id="userCount">0</span>
                </div>
                <div class="user-list" id="userList">
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <p>No users found</p>
                    </div>
                </div>
            </div>

            <div class="glass card">
                <div class="card-header">
                    <h3><i class="fas fa-history" style="color: #60a5fa;"></i> Logs</h3>
                    <span class="badge">Live</span>
                </div>
                <div class="log-list" id="logList">
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No logs yet</p>
                    </div>
                </div>
            </div>

        </div>

        <div class="glass card" style="margin-top: 24px;">
            <div class="card-header">
                <h3><i class="fas fa-tools" style="color: #fbbf24;"></i> Admin Actions</h3>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="refreshData()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
                <button class="btn btn-danger" onclick="clearAllData()">
                    <i class="fas fa-trash-alt"></i> Clear All Data
                </button>
            </div>
        </div>

    </div>

    <script>
        async function apiCall(url, method = 'GET', data = null) {
            const options = { method, credentials: 'include', headers: { 'Content-Type': 'application/json' } };
            if (data) options.body = JSON.stringify(data);
            const response = await fetch(url, options);
            const result = await response.json();
            return { response, result };
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const bgImage = document.getElementById('bgImage');
            const img = new Image();
            img.onload = function() {
                bgImage.style.backgroundImage = "url('https://i.ibb.co.com/k2ZL25g3/background.jpg')";
                bgImage.classList.remove('error');
            };
            img.onerror = function() { bgImage.classList.add('error'); };
            img.src = 'https://i.ibb.co.com/k2ZL25g3/background.jpg';
        });

        let currentUser = null;

        async function checkAuth() {
            try {
                const { response, result } = await apiCall('/api/auth/verify', 'GET');
                if (response.ok && result.role === 'admin') {
                    currentUser = result;
                    document.getElementById('userAvatar').textContent = (result.username || 'A')[0].toUpperCase();
                    document.getElementById('userName').textContent = result.username || 'Admin';
                    loadAdminData();
                } else {
                    window.location.href = '/dashboard';
                }
            } catch (e) {
                window.location.href = '/login';
            }
        }

        async function loadAdminData() {
            await loadUsers();
            await loadLogs();
            await loadStats();
        }

        async function loadUsers() {
            try {
                const { response, result } = await apiCall('/api/admin/users', 'GET');
                if (response.ok) {
                    renderUsers(result.users || []);
                    document.getElementById('userCount').textContent = result.total || 0;
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('userList');
            if (!users || users.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-users"></i><p>No users found</p></div>`;
                return;
            }
            container.innerHTML = users.map(user => `
                <div class="user-item">
                    <div class="user-info">
                        <div class="user-avatar">${(user.username || 'U')[0].toUpperCase()}</div>
                        <div>
                            <div class="user-name">${user.username}</div>
                            <div class="user-email">${user.email}</div>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span class="user-status ${user.is_active ? 'active' : 'inactive'}">
                            ${user.is_active ? '● Active' : '● Inactive'}
                        </span>
                        <div class="user-actions">
                            <button class="btn-toggle ${user.is_active ? 'active' : ''}" 
                                    onclick="toggleUser('${user.uid || user.id}', ${!user.is_active})">
                                ${user.is_active ? 'Deactivate' : 'Activate'}
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function toggleUser(userId, activate) {
            try {
                const { response } = await apiCall(`/api/admin/users/${userId}/toggle`, 'POST', { activate });
                if (response.ok) {
                    showToast(`✅ User ${activate ? 'activated' : 'deactivated'}`, 'success');
                    loadUsers();
                } else {
                    showToast('❌ Failed to toggle user', 'error');
                }
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            }
        }

        async function loadLogs() {
            try {
                const { response, result } = await apiCall('/api/admin/logs', 'GET');
                if (response.ok) {
                    renderLogs(result.logs || []);
                }
            } catch (error) {
                console.error('Error loading logs:', error);
            }
        }

        function renderLogs(logs) {
            const container = document.getElementById('logList');
            if (!logs || logs.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No logs yet</p></div>`;
                return;
            }
            container.innerHTML = logs.map(log => `
                <div class="log-item">
                    <span>${log.action}</span>
                    <span class="log-time">${new Date(log.timestamp).toLocaleTimeString()}</span>
                    <span class="log-action ${log.action}">${log.action?.toUpperCase() || 'UNKNOWN'}</span>
                </div>
            `).join('');
        }

        async function loadStats() {
            try {
                const { response, result } = await apiCall('/api/admin/stats', 'GET');
                if (response.ok) {
                    document.getElementById('totalUsers').textContent = result.users || 0;
                    document.getElementById('totalJWTs').textContent = result.jwts || 0;
                    document.getElementById('totalSwipes').textContent = result.swipes || 0;
                    document.getElementById('activeUsers').textContent = result.active_users || 0;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function refreshData() {
            showToast('🔄 Refreshing...', 'info');
            await loadAdminData();
            showToast('✅ Refreshed', 'success');
        }

        async function clearAllData() {
            if (!confirm('⚠️ This will delete ALL data. Are you sure?')) return;
            try {
                const { response } = await apiCall('/api/admin/clear-data', 'POST');
                if (response.ok) {
                    showToast('✅ All data cleared', 'success');
                    await loadAdminData();
                } else {
                    showToast('❌ Failed to clear data', 'error');
                }
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            }
        }

        async function handleLogout() {
            try {
                await apiCall('/api/auth/logout', 'POST');
                localStorage.removeItem('exu_user');
                window.location.href = '/login';
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', checkAuth);

        window.toggleUser = toggleUser;
        window.refreshData = refreshData;
        window.clearAllData = clearAllData;
        window.handleLogout = handleLogout;
    </script>

</body>
</html>
