<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXUCODER PROXY · Login</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        /* ----- RESET & BASE ----- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            overflow: hidden;
            position: relative;
            background: #0a0e1a;
        }

        /* ----- BACKGROUND ----- */
        .bg-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            inset: 0;
            background-image: url('https://i.ibb.co.com/k2ZL25g3/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.85;
            animation: slowZoom 25s ease-in-out infinite alternate;
            transform-origin: center;
        }

        @keyframes slowZoom {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(0.5deg); }
            100% { transform: scale(1.12) rotate(-0.5deg); }
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 30% 40%, rgba(123, 47, 252, 0.12) 0%, transparent 55%),
                radial-gradient(circle at 70% 60%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.15) 0%, transparent 70%);
            animation: pulseOverlay 10s ease-in-out infinite alternate;
            mix-blend-mode: overlay;
        }

        @keyframes pulseOverlay {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            animation: gridMove 30s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            animation: floatBlob 25s ease-in-out infinite;
            mix-blend-mode: screen;
        }

        .blob.a { width: 500px; height: 500px; background: #7b2ffc; top: -150px; left: -150px; animation-delay: 0s; }
        .blob.b { width: 450px; height: 450px; background: #00d4ff; bottom: -150px; right: -150px; animation-delay: -8s; opacity: 0.2; }
        .blob.c { width: 350px; height: 350px; background: #ec4899; top: 45%; left: 55%; animation-delay: -16s; opacity: 0.15; }
        .blob.d { width: 300px; height: 300px; background: #f59e0b; top: 10%; left: 30%; animation-delay: -5s; opacity: 0.12; }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(80px, -60px) scale(1.1) rotate(5deg); }
            50% { transform: translate(-40px, 80px) scale(0.95) rotate(-3deg); }
            75% { transform: translate(60px, 40px) scale(1.05) rotate(4deg); }
        }

        /* ----- GLASS CARD ----- */
        .glass {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            overflow: hidden;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 440px;
            padding: 40px 40px 32px;
        }

        .glass::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 30%, transparent 70%, rgba(255,255,255,0.02) 100%);
            pointer-events: none;
        }

        .glass::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 42px;
            background: conic-gradient(from 0deg, transparent 0%, rgba(123, 47, 252, 0.1) 20%, transparent 40%, rgba(0, 212, 255, 0.1) 60%, transparent 80%, rgba(123, 47, 252, 0.1) 100%);
            z-index: -1;
            animation: borderGlow 8s linear infinite;
            opacity: 0.5;
        }

        @keyframes borderGlow {
            to { transform: rotate(360deg); }
        }

        /* ----- BRAND ----- */
        .brand {
            text-align: center;
            margin-bottom: 28px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        .brand .logo-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #7b2ffc, #00d4ff, #ec4899, #7b2ffc);
            animation: spinRing 4s linear infinite;
            padding: 2px;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .brand .logo-img {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            position: relative;
            border: 3px solid rgba(255,255,255,0.1);
            background: #0a0e1a;
            transition: transform 0.5s ease;
        }

        .brand .logo-img:hover {
            transform: scale(1.08) rotate(-5deg);
        }

        .brand .title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 6px;
            animation: shimmer 3s ease-in-out infinite;
            background-size: 200% 200%;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .brand .sub {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-top: 2px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ----- TABS ----- */
        .auth-tabs {
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 22px;
            position: relative;
            animation: fadeInUp 0.6s ease 0.2s both;
            overflow: hidden;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: color 0.3s ease;
            font-family: inherit;
            position: relative;
            z-index: 2;
        }

        .auth-tab.active {
            color: white;
        }

        .auth-tab:hover:not(.active) {
            color: rgba(255,255,255,0.8);
        }

        .tab-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: rgba(123, 47, 252, 0.35);
            border-radius: 12px;
            transition: transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
            box-shadow: 0 4px 20px rgba(123, 47, 252, 0.25);
            z-index: 1;
            will-change: transform;
        }

        .tab-slider.right {
            transform: translateX(calc(100% + 4px));
        }

        /* ----- FORM ----- */
        .form-wrapper {
            position: relative;
            min-height: 260px;
            overflow: visible;
        }

        .form-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 1;
            transform: translateX(0) scale(1);
            transition: all 0.45s cubic-bezier(0.34, 1.2, 0.64, 1), visibility 0s linear;
            visibility: visible;
            pointer-events: auto;
            padding: 0 2px;
        }

        .form-container.hidden {
            opacity: 0;
            transform: translateX(30px) scale(0.95);
            pointer-events: none;
            visibility: hidden;
            transition: all 0.45s cubic-bezier(0.34, 1.2, 0.64, 1), visibility 0s linear 0.45s;
        }

        .form-container.hidden-left {
            opacity: 0;
            transform: translateX(-30px) scale(0.95);
            pointer-events: none;
            visibility: hidden;
            transition: all 0.45s cubic-bezier(0.34, 1.2, 0.64, 1), visibility 0s linear 0.45s;
        }

        .form-group {
            margin-bottom: 14px;
            animation: fadeInUp 0.5s ease both;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group .input-wrapper svg.icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 17px;
            height: 17px;
            color: rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            pointer-events: none;
            flex-shrink: 0;
        }

        .form-group input {
            width: 100%;
            padding: 12px 44px 12px 44px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(123, 47, 252, 0.5);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 4px rgba(123, 47, 252, 0.1);
            transform: scale(1.01);
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .form-group .input-wrapper:focus-within svg.icon {
            color: #7b2ffc;
            transform: translateY(-50%) scale(1.1);
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border-radius: 6px;
            z-index: 5;
        }

        .toggle-password:hover {
            color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.05);
            transform: translateY(-50%) scale(1.1);
        }

        .toggle-password svg {
            width: 17px;
            height: 17px;
            display: block;
        }

        /* ----- BUTTONS ----- */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7b2ffc, #00d4ff);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            position: relative;
            overflow: hidden;
            margin-top: 2px;
            animation: fadeInUp 0.5s ease 0.3s both;
            box-shadow: 0 4px 15px rgba(123, 47, 252, 0.2);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .btn-primary:hover:not(:disabled)::before {
            transform: translateX(100%);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 47, 252, 0.3);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 2px 10px rgba(123, 47, 252, 0.2);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-primary .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ----- TOAST ----- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: rgba(52, 211, 153, 0.3);
            background: rgba(52, 211, 153, 0.1);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.1);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 480px) {
            .glass { padding: 28px 20px 24px; border-radius: 28px; }
            .brand .title { font-size: 24px; }
            .brand .logo-img { width: 60px; height: 60px; }
            .brand { margin-bottom: 20px; }
            .form-group input { padding: 11px 40px 11px 40px; font-size: 13px; }
            .form-group .input-wrapper svg.icon { left: 12px; width: 15px; height: 15px; }
            .toggle-password { right: 8px; padding: 3px; }
            .toggle-password svg { width: 15px; height: 15px; }
            .btn-primary { padding: 12px; font-size: 14px; }
            .auth-tab { font-size: 12px; padding: 8px; }
            .form-wrapper { min-height: 230px; }
            .blob.a, .blob.b, .blob.c, .blob.d { filter: blur(60px); opacity: 0.15; }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-container">
        <div class="bg-image" id="bgImage"></div>
        <div class="bg-overlay"></div>
        <div class="bg-grid"></div>
        <div class="blob a"></div>
        <div class="blob b"></div>
        <div class="blob c"></div>
        <div class="blob d"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Login Card -->
    <div class="glass">

        <!-- Brand -->
        <div class="brand">
            <div class="logo-wrapper">
                <div class="logo-ring"></div>
                <img 
                    src="https://i.ibb.co.com/gBfhXFN/mrhimcho-fyp-pfp-virelvideo-unfrezzmyaccount-JPEG-1.jpg" 
                    alt="EXUCODER Logo" 
                    class="logo-img"
                    onerror="this.style.display='none'; this.parentElement.querySelector('.logo-ring')?.style?.setProperty('display', 'none')"
                />
            </div>
            <div class="title">𝐄𝐗𝐔𝐂𝐎𝐃𝐄𝐑</div>
            <div class="sub">𝐉𝐖𝐓 𝐏𝐫𝐨𝐱𝐲 · 𝐂𝐚𝐩𝐭𝐮𝐫𝐞 & 𝐒𝐰𝐢𝐩𝐞</div>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs" id="authTabs">
            <div class="tab-slider" id="tabSlider"></div>
            <button class="auth-tab active" data-tab="login" onclick="switchTab('login')">
                𝐋𝐨𝐠𝐢𝐧
            </button>
            <button class="auth-tab" data-tab="register" onclick="switchTab('register')">
                𝐑𝐞𝐠𝐢𝐬𝐭𝐞𝐫
            </button>
        </div>

        <!-- Form Wrapper -->
        <div class="form-wrapper" id="formWrapper">
            <!-- Login Form -->
            <div id="loginForm" class="form-container">
                <div class="form-group">
                    <label>𝐔𝐬𝐞𝐫𝐧𝐚𝐦𝐞</label>
                    <div class="input-wrapper">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="loginUsername" placeholder="Enter your username" />
                    </div>
                </div>
                <div class="form-group">
                    <label>𝐏𝐚𝐬𝐬𝐰𝐨𝐫𝐝</label>
                    <div class="input-wrapper">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="loginPassword" placeholder="Enter your password" />
                        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')" aria-label="Toggle password visibility">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
                    <span class="btn-content">
                        <span>𝐒𝐢𝐠𝐧 𝐈𝐧</span>
                    </span>
                </button>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="form-container hidden">
                <div class="form-group">
                    <label>𝐔𝐬𝐞𝐫𝐧𝐚𝐦𝐞</label>
                    <div class="input-wrapper">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="registerUsername" placeholder="Choose a username" />
                    </div>
                </div>
                <div class="form-group">
                    <label>𝐄𝐦𝐚𝐢𝐥</label>
                    <div class="input-wrapper">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input type="email" id="registerEmail" placeholder="you@example.com" />
                    </div>
                </div>
                <div class="form-group">
                    <label>𝐏𝐚𝐬𝐬𝐰𝐨𝐫𝐝</label>
                    <div class="input-wrapper">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="registerPassword" placeholder="Min 6 characters" />
                        <button type="button" class="toggle-password" onclick="togglePassword('registerPassword')" aria-label="Toggle password visibility">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="btn-primary" id="registerBtn" onclick="handleRegister()">
                    <span class="btn-content">
                        <span>𝐂𝐫𝐞𝐚𝐭𝐞 𝐀𝐜𝐜𝐨𝐮𝐧𝐭</span>
                    </span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // =====================================================================
        // DOM ELEMENTS
        // =====================================================================
        const toast = document.getElementById('toast');
        let toastTimer = null;
        let currentTab = 'login';

        // =====================================================================
        // TOAST SYSTEM
        // =====================================================================
        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // =====================================================================
        // BACKGROUND IMAGE
        // =====================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const bgImage = document.getElementById('bgImage');
            const img = new Image();
            img.onload = function() {
                bgImage.style.backgroundImage = "url('https://i.ibb.co.com/k2ZL25g3/background.jpg')";
                bgImage.classList.remove('error');
            };
            img.onerror = function() {
                bgImage.classList.add('error');
                console.log('Background image failed to load, using fallback gradient.');
            };
            img.src = 'https://i.ibb.co.com/k2ZL25g3/background.jpg';
        });

        // =====================================================================
        // TAB SWITCHING
        // =====================================================================
        function switchTab(tab) {
            if (tab === currentTab) return;

            const tabs = document.querySelectorAll('.auth-tab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const slider = document.getElementById('tabSlider');

            slider.classList.toggle('right', tab === 'register');

            tabs.forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

            if (tab === 'login') {
                loginForm.classList.remove('hidden', 'hidden-left');
                registerForm.classList.add('hidden');
                registerForm.classList.remove('hidden-left');
            } else {
                registerForm.classList.remove('hidden', 'hidden-left');
                loginForm.classList.add('hidden-left');
                loginForm.classList.remove('hidden');
            }

            currentTab = tab;
        }

        // =====================================================================
        // TOGGLE PASSWORD VISIBILITY
        // =====================================================================
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const btn = input.parentElement.querySelector('.toggle-password');
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>`;
            }
        }

        // =====================================================================
        // SET BUTTON LOADING STATE
        // =====================================================================
        function setButtonLoading(btn, loading) {
            const content = btn.querySelector('.btn-content');
            if (loading) {
                btn.disabled = true;
                const originalText = btn.id === 'loginBtn' ? 'Sign In' : 'Create Account';
                content.innerHTML = `<span class="spinner"></span> <span>Loading...</span>`;
                btn._originalText = originalText;
            } else {
                btn.disabled = false;
                const text = btn._originalText || (btn.id === 'loginBtn' ? 'Sign In' : 'Create Account');
                content.innerHTML = `<span>${text}</span>`;
            }
        }

        // =====================================================================
        // API HELPER
        // =====================================================================
        async function apiCall(url, method = 'GET', data = null) {
            const options = {
                method,
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                }
            };
            if (data) {
                options.body = JSON.stringify(data);
            }
            const response = await fetch(url, options);
            const result = await response.json();
            return { response, result };
        }

        // =====================================================================
        // LOGIN HANDLER
        // =====================================================================
        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                showToast('⚠️ Please fill in all fields', 'error');
                return;
            }

            setButtonLoading(btn, true);

            try {
                const { response, result } = await apiCall('/api/auth/login', 'POST', {
                    username,
                    password
                });

                if (response.ok) {
                    showToast('✅ Login successful! Redirecting...', 'success');
                    localStorage.setItem('exu_user', JSON.stringify(result.user));
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showToast('❌ ' + (result.error || 'Login failed'), 'error');
                }
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            }

            setButtonLoading(btn, false);
        }

        // =====================================================================
        // REGISTER HANDLER
        // =====================================================================
        async function handleRegister() {
            const username = document.getElementById('registerUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const btn = document.getElementById('registerBtn');

            if (!username || !email || !password) {
                showToast('⚠️ Please fill in all fields', 'error');
                return;
            }

            if (username.length < 3) {
                showToast('⚠️ Username must be at least 3 characters', 'error');
                return;
            }

            if (password.length < 6) {
                showToast('⚠️ Password must be at least 6 characters', 'error');
                return;
            }

            setButtonLoading(btn, true);

            try {
                const { response, result } = await apiCall('/api/auth/register', 'POST', {
                    username,
                    email,
                    password
                });

                if (response.ok) {
                    showToast('✅ Account created successfully!', 'success');
                    // Auto login after registration
                    const loginResponse = await apiCall('/api/auth/login', 'POST', {
                        username,
                        password
                    });
                    if (loginResponse.response.ok) {
                        localStorage.setItem('exu_user', JSON.stringify(loginResponse.result.user));
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 1500);
                    }
                } else {
                    showToast('❌ ' + (result.error || 'Registration failed'), 'error');
                }
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            }

            setButtonLoading(btn, false);
        }

        // =====================================================================
        // ENTER KEY SUPPORT
        // =====================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginForm = document.getElementById('loginForm');
                const registerForm = document.getElementById('registerForm');

                if (!loginForm.classList.contains('hidden') && !loginForm.classList.contains('hidden-left')) {
                    handleLogin();
                } else if (!registerForm.classList.contains('hidden') && !registerForm.classList.contains('hidden-left')) {
                    handleRegister();
                }
            }
        });

        // =====================================================================
        // AUTO-REDIRECT IF ALREADY LOGGED IN
        // =====================================================================
        async function checkAuth() {
            try {
                const { response } = await apiCall('/api/auth/verify', 'GET');
                if (response.ok) {
                    window.location.href = '/dashboard';
                }
            } catch (e) {
                // Not authenticated, stay on login page
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });

        // Expose functions globally
        window.switchTab = switchTab;
        window.togglePassword = togglePassword;
        window.handleLogin = handleLogin;
        window.handleRegister = handleRegister;
        window.showToast = showToast;
    </script>

</body>
</html>
